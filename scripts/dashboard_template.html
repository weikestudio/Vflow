<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vflow · 内容工作台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#272c37;
    --ink:#e8e5df; --muted:#8b8578; --dim:#5f5a50;
    --accent:#e85d04; --ok:#2a9d8f; --warn:#d9a400;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","DM Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:28px 32px 60px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto}

  header{display:flex;align-items:flex-end;justify-content:space-between;
    padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:26px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .sub{font-size:12px;color:var(--dim);margin-top:4px;font-family:ui-monospace,monospace}
  .refresh{font-size:12px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px}

  h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em;
    text-transform:uppercase;margin:32px 0 14px;font-family:ui-monospace,monospace}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .stat b{display:block;font-size:26px;font-weight:600;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.acc b{color:var(--accent)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
  .proj-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .proj-head h3{font-size:19px;font-weight:600}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);font-family:ui-monospace,monospace}
  .tag.live{border-color:rgba(232,93,4,.5);color:var(--accent);background:rgba(232,93,4,.08)}
  .oneline{color:var(--muted);font-size:14px;margin-bottom:18px}

  .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff8a3d)}

  .stages{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .st{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:11px 10px;cursor:pointer;transition:.15s}
  .st:hover{border-color:var(--muted)}
  .st .k{font-size:10px;font-family:ui-monospace,monospace;color:var(--dim)}
  .st .n{font-size:13px;font-weight:600;margin:3px 0 7px}
  .st .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:block}
  .st.done .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(42,157,143,.15)}
  .st.tpl .dot{background:var(--warn)}
  .st.done .n{color:var(--ink)}
  .st.tpl .n,.st.miss .n{color:var(--muted)}
  .st.miss{opacity:.5}
  .st.sel{border-color:var(--accent);background:rgba(232,93,4,.06)}

  .detail{margin-top:16px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:16px 18px;display:none}
  .detail.on{display:block}
  .detail h4{font-size:14px;margin-bottom:4px}
  .detail .sk{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace;margin-bottom:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
  .kv dt{color:var(--muted);white-space:nowrap}
  .kv dd{color:var(--ink)}
  .next{margin-top:18px;padding:12px 16px;border-left:2px solid var(--accent);
    background:rgba(232,93,4,.07);border-radius:0 6px 6px 0;font-size:14px}
  .next b{color:var(--accent);font-size:11px;display:block;margin-bottom:3px;
    font-family:ui-monospace,monospace;letter-spacing:.08em}

  .flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .fx{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  .fx .i{font-size:10px;font-family:ui-monospace,monospace;color:var(--accent)}
  .fx b{display:block;font-size:14px;margin:4px 0 8px}
  .fx span{font-size:11px;color:var(--dim);line-height:1.45;display:block}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--dim);font-weight:500;
    padding:0 12px 10px;font-family:ui-monospace,monospace;letter-spacing:.05em}
  td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
  td.name{font-weight:500}
  .mini{display:flex;gap:3px}
  .mini i{width:14px;height:4px;border-radius:2px;background:var(--panel2);display:block}
  .mini i.done{background:var(--ok)} .mini i.tpl{background:var(--warn)}
  .muted{color:var(--muted)} .dim{color:var(--dim);font-size:12px}

  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .sc span{font-size:11px;color:var(--dim);display:block;margin-bottom:4px;
    font-family:ui-monospace,monospace}
  .sc b{font-size:13px;font-weight:500}
  footer{margin-top:34px;font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1><span id="acctName">Vflow</span> · 内容工作台</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="refresh" id="refresh"></div>
</header>

<h2>概览</h2>
<div class="stats" id="stats"></div>

<h2>当前项目</h2>
<div class="card" id="active"></div>

<h2>流水线定义</h2>
<div class="flow" id="flow"></div>

<h2>全部项目</h2>
<div class="card"><table id="all"></table></div>

<h2>账号设定</h2>
<div class="sgrid" id="studio"></div>

<footer id="foot"></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const ST = {}; D.stages.forEach(function (s) { ST[s.key] = s; });
const P = D.projects.find(function (p) { return p.slug === D.active; }) || D.projects[0];
let sel = null;

document.getElementById("sub").textContent = D.root;
document.getElementById("refresh").textContent = "数据生成于 " + D.generated;

var statDefs = [
  ["真实选题", D.stats.total, "acc"],
  ["已成片", D.stats.shipped, ""],
  ["进行中", D.stats.in_progress, ""],
  ["已复盘", D.stats.reviewed, ""],
  ["待复盘", D.stats.pending_review, ""],
  ["验证项目", D.stats.test, ""]
];
document.getElementById("stats").innerHTML = statDefs.map(function (x) {
  return '<div class="stat ' + x[2] + '"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>';
}).join("");

function kv(meta) {
  var keys = Object.keys(meta);
  if (!keys.length) return '<p class="muted">这一阶段还是空模板，还没填内容。</p>';
  return '<dl class="kv">' + keys.map(function (k) {
    return "<dt>" + k + "</dt><dd>" + meta[k] + "</dd>";
  }).join("") + "</dl>";
}

function renderActive() {
  var stages = D.stages.map(function (s) {
    var st = P.states[s.key] || { state: "missing", meta: {} };
    var cls = st.state === "done" ? "done" : (st.state === "template" ? "tpl" : "miss");
    return '<div class="st ' + cls + (sel === s.key ? " sel" : "") + '" data-k="' + s.key + '">' +
      '<span class="dot"></span><div class="k">' + s.key + '</div><div class="n">' + s.name + '</div></div>';
  }).join("");

  document.getElementById("active").innerHTML =
    '<div class="proj-head"><h3>' + P.title + '</h3>' +
    '<span class="tag">' + P.date + '</span>' +
    '<span class="tag live">进行中</span>' +
    '<span class="tag">' + P.done_n + " / " + P.total_n + ' 阶段完成</span></div>' +
    '<div class="oneline">' + (P.one_liner || "（选题卡还没填）") + '</div>' +
    '<div class="bar"><i style="width:' + P.progress + '%"></i></div>' +
    '<div class="stages">' + stages + '</div>' +
    '<div class="detail" id="detail"></div>' +
    '<div class="next"><b>下一步</b>' + P.next + '</div>';

  var els = document.querySelectorAll(".st");
  for (var i = 0; i < els.length; i++) {
    els[i].onclick = (function (el) {
      return function () {
        sel = (sel === el.getAttribute("data-k")) ? null : el.getAttribute("data-k");
        renderActive();
        if (sel) {
          var s = ST[sel], st = P.states[sel] || { state: "missing", meta: {} };
          var d = document.getElementById("detail");
          d.className = "detail on";
          d.innerHTML = "<h4>" + s.key + " · " + s.name + "</h4>" +
            '<div class="sk">调用：' + s.skills + '</div>' + kv(st.meta);
        }
      };
    })(els[i]);
  }
  if (sel) document.getElementById("detail").className = "detail on";
}
renderActive();

document.getElementById("flow").innerHTML = D.stages.filter(function (s) {
  return s.key !== "03b";
}).map(function (s, i) {
  return '<div class="fx"><span class="i">STEP ' + (i + 1) + '</span><b>' + s.name +
    '</b><span>' + s.skills + '</span></div>';
}).join("");

var rows = D.projects.map(function (p) {
  var mini = D.stages.map(function (s) {
    var st = p.states[s.key] || { state: "missing" };
    return '<i class="' + (st.state === "done" ? "done" : (st.state === "template" ? "tpl" : "")) + '"></i>';
  }).join("");
  var st2 = p.done_n === 0 ? "未启动" : p.next;
  var reviewTag = p.pending_review ? ' <span class="tag">待复盘</span>' : "";
  var kindTag = p.kind === "real" ? "" :
    ' <span class="tag">' + (p.kind === "test" ? "链路验证" : "空壳") + '</span>';
  return '<tr><td class="name">' + p.title + reviewTag + kindTag + '</td><td class="dim">' + p.date +
    '</td><td><div class="mini">' + mini + '</div></td><td class="dim">' + p.done_n + '/' + p.total_n +
    '</td><td class="muted">' + st2 + '</td></tr>';
}).join("");
document.getElementById("all").innerHTML =
  '<thead><tr><th>项目</th><th>日期</th><th>阶段</th><th>进度</th><th>下一步</th></tr></thead><tbody>' +
  rows + '</tbody>';

var sd = D.studio;
if (sd && sd["账号名"] && sd["账号名"].indexOf("未填") < 0) {
  document.getElementById("acctName").textContent = sd["账号名"];
}
document.getElementById("studio").innerHTML = Object.keys(sd).map(function (k) {
  return '<div class="sc"><span>' + k + '</span><b>' + sd[k] + '</b></div>';
}).join("");

document.getElementById("foot").textContent =
  "重新生成：python3 ~/shortvideo-studio/scripts/build_dashboard.py";
</script>
</body>
</html>
